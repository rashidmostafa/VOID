<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--background)}.r{display:flex;gap:var(--space-4);align-items:flex-end}.k{font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-sm);border:1px solid var(--border)}</style>
</head><body><div class="dark" style="background:var(--background);border-radius:var(--radius-md);padding:var(--space-4);display:flex;gap:var(--space-4);align-items:flex-end">
<div class="sw"><div class="chip" style="background:oklch(0.145 0 0)"></div><div class="k">background</div><div class="k" style="color:var(--line-strong)">0.145</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.205 0 0)"></div><div class="k">card</div><div class="k" style="color:var(--line-strong)">0.205</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.269 0 0)"></div><div class="k">secondary</div><div class="k" style="color:var(--line-strong)">0.269</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.708 0 0)"></div><div class="k">muted-fg</div><div class="k" style="color:var(--line-strong)">0.708</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.922 0 0)"></div><div class="k">primary</div><div class="k" style="color:var(--line-strong)">0.922</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.985 0 0)"></div><div class="k">foreground</div><div class="k" style="color:var(--line-strong)">0.985</div></div>
<div class="sw" style="justify-content:flex-end;height:56px"><div class="k" style="max-width:170px;line-height:1.5;color:var(--muted-foreground)">Studio and admin only. The storefront is light.</div></div>
</div></body></html>
