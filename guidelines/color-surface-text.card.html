<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces & text" subtitle="Page, card and sunken surfaces with the text pairs that are legal on each." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--background)}.r{display:flex;gap:var(--space-4);align-items:flex-end}.k{font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-sm);border:1px solid var(--border)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)">
<div style="background:var(--background);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-4)"><div style="font-size:var(--text-base)">Page body</div><div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:4px">--background / --foreground</div></div>
<div style="background:var(--muted);border-radius:var(--radius-md);padding:var(--space-4)"><div style="font-size:var(--text-base)">Sunken row</div><div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:4px">--muted / --muted-foreground</div></div>
<div style="background:var(--sidebar);border:1px solid var(--sidebar-border);border-radius:var(--radius-md);padding:var(--space-4)"><div style="font-size:var(--text-base)">Sidebar</div><div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:4px">--sidebar / --sidebar-foreground</div></div>
<div style="background:var(--primary);border-radius:var(--radius-md);padding:var(--space-4)"><div style="font-size:var(--text-base);color:var(--primary-foreground)">Inverse block</div><div style="font-size:var(--text-xs);color:oklch(0.708 0 0);margin-top:4px">--primary / --primary-foreground</div></div>
</div></body></html>
