<!-- @dsCard group="Colors" viewport="700x150" name="Interactive states" subtitle="Primary action: rest, hover (one step lighter-dark), pressed, disabled." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--background)}.r{display:flex;gap:var(--space-4);align-items:flex-end}.k{font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-sm);border:1px solid var(--border)}</style>
</head><body><div class="r" style="align-items:center;gap:var(--space-5)">
<div class="sw"><div class="chip" style="background:var(--primary);width:120px"></div><div class="k">rest · 0.205</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.30 0 0);width:120px"></div><div class="k">hover · 0.30</div></div>
<div class="sw"><div class="chip" style="background:var(--primary);width:120px;transform:scale(0.985)"></div><div class="k">press · scale 0.985</div></div>
<div class="sw"><div class="chip" style="background:var(--primary);width:120px;opacity:0.45"></div><div class="k">disabled · 45%</div></div>
<div class="sw"><div class="chip" style="background:var(--background);width:120px;box-shadow:var(--focus-ring)"></div><div class="k">focus ring · 2px</div></div>
</div></body></html>
