<!-- @dsCard group="Brand" viewport="700x170" name="Hairlines & focus" subtitle="1px --border separates; --line-strong emphasises; links keep an underline rule." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--background)}.r{display:flex;gap:var(--space-4);align-items:flex-end}.k{font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-sm);border:1px solid var(--border)}</style>
</head><body><div style="display:flex;gap:var(--space-8);align-items:center">
<div class="sw" style="gap:10px;width:180px"><div style="border-top:1px solid var(--border)"></div><div class="k">--border · 0.922</div><div style="border-top:1px solid var(--line-strong)"></div><div class="k">--line-strong · 0.87</div><div style="border-top:1px solid var(--foreground)"></div><div class="k">--foreground · active tab</div></div>
<div class="sw" style="gap:10px"><a href="#" style="font-size:var(--text-md)">Track your order</a><div class="k">link · hairline underline, darkens on hover</div></div>
<div class="sw" style="gap:10px"><input value="Focused field" style="height:38px;padding:0 12px;border:1px solid var(--ring);border-radius:var(--radius-md);box-shadow:var(--focus-ring);background:var(--background)"><div class="k">2px ring, 2px offset</div></div>
</div></body></html>
