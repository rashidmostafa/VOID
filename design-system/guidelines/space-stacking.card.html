<!-- @dsCard group="Spacing" viewport="700x180" name="Stacking & touch target" subtitle="One ordered z-index scale, no duplicates; 44px minimum effective target." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg-canvas)}.k{font:var(--type-mono);font-size:var(--text-2xs);color:var(--fg-secondary)}
.chip{display:inline-flex;align-items:center;height:24px;padding-inline:8px;border:1px solid;border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:500}
.sw{display:flex;flex-direction:column;gap:6px}</style></head><body><div style="display:flex;gap:var(--space-10);align-items:flex-start">
<div class="sw" style="gap:6px">
<div style="display:flex;gap:12px;align-items:baseline"><span class="k" style="width:110px">--z-dropdown</span><span style="font-variant-numeric:tabular-nums;font-size:var(--text-ui)">1000</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="k" style="width:110px">--z-sticky</span><span style="font-variant-numeric:tabular-nums;font-size:var(--text-ui)">1100</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="k" style="width:110px">--z-drawer</span><span style="font-variant-numeric:tabular-nums;font-size:var(--text-ui)">1200</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="k" style="width:110px">--z-modal</span><span style="font-variant-numeric:tabular-nums;font-size:var(--text-ui)">1300</span></div><div style="display:flex;gap:12px;align-items:baseline"><span class="k" style="width:110px">--z-toast</span><span style="font-variant-numeric:tabular-nums;font-size:var(--text-ui)">1400</span></div>
</div>
<div style="display:flex;gap:var(--space-5);align-items:flex-end">
<div class="sw"><div style="height:36px;padding-inline:16px;display:inline-flex;align-items:center;background:var(--action-primary-bg);color:var(--action-primary-text);border-radius:var(--radius-md);font-size:var(--text-base);font-weight:500">Add to bag</div><div class="k">sm · 36px · pointer-only</div></div><div class="sw"><div style="height:44px;padding-inline:16px;display:inline-flex;align-items:center;background:var(--action-primary-bg);color:var(--action-primary-text);border-radius:var(--radius-md);font-size:var(--text-base);font-weight:500">Add to bag</div><div class="k">md · 44px · default</div></div><div class="sw"><div style="height:52px;padding-inline:16px;display:inline-flex;align-items:center;background:var(--action-primary-bg);color:var(--action-primary-text);border-radius:var(--radius-md);font-size:var(--text-base);font-weight:500">Add to bag</div><div class="k">lg · 52px · storefront CTA</div></div>
<div class="sw"><div style="width:44px;height:44px;border:1px dashed var(--border-control);display:flex;align-items:center;justify-content:center"><div style="width:36px;height:36px;background:var(--bg-surface-sunken);border:1px solid var(--border-control)"></div></div><div class="k">36px control,<br>44px hit area</div></div>
</div>
</div></body></html>
