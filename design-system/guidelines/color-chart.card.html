<!-- @dsCard group="Colors" viewport="700x150" name="Chart ramp" subtitle="The only saturated colour in the system. Data visualisation and derived semantics only." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--background)}.r{display:flex;gap:var(--space-4);align-items:flex-end}.k{font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-sm);border:1px solid var(--border)}</style>
</head><body><div class="r" style="gap:var(--space-4)">
<div class="sw"><div class="chip" style="background:var(--chart-1)"></div><div class="k">chart-1</div><div class="k" style="color:var(--line-strong)">41°</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-2)"></div><div class="k">chart-2</div><div class="k" style="color:var(--line-strong)">185°</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-3)"></div><div class="k">chart-3</div><div class="k" style="color:var(--line-strong)">227°</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-4)"></div><div class="k">chart-4</div><div class="k" style="color:var(--line-strong)">84°</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-5)"></div><div class="k">chart-5</div><div class="k" style="color:var(--line-strong)">70°</div></div>
<div class="sw" style="justify-content:flex-end;height:56px"><div class="k" style="max-width:200px;line-height:1.5">Never use a chart hue for a button, link, icon or brand surface.</div></div>
</div></body></html>
