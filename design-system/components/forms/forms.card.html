<!-- @dsCard group="Components" viewport="700x330" name="Form controls" subtitle="Input, Select, Checkbox, Radio, Switch with hint and error states" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.VOID_ICON_SPRITE="../../assets/icons/void-icons.svg"</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--background)}.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:var(--space-4)}.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-widest);color:var(--text-muted)}</style>
</head><body><div id="root"></div><script type="text/babel">
const NS = window.VoidDesignSystem_980885;
const { Input, Select, Checkbox, Radio, Switch } = NS;
function Demo(){const [on,setOn]=React.useState(true);const [bn,setBn]=React.useState(false);const [ship,setShip]=React.useState('std');
return (<div className="col">
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'var(--space-4)'}}>
    <Input label="Product title" defaultValue="Handloom cotton kurta"/>
    <Input label="Price" prefix={<span>৳</span>} suffix="BDT" defaultValue="2450"/>
    <Select label="Market" options={['Bangladesh','India','UAE','United Kingdom']}/>
    <Input label="Email" error="We could not verify this address" defaultValue="rafi@"/>
    <Input label="SKU" hint="Auto-generated if left blank" placeholder="VD-0000"/>
    <Select label="Sort" size="sm" options={['New in','Price: low to high']}/>
  </div>
  <div className="row" style={{gap:'var(--space-6)'}}>
    <Checkbox label="Also list in India" description="Prices convert at the daily rate" checked={on} onChange={()=>setOn(!on)}/>
    <Checkbox indeterminate label="Select all"/>
    <Radio name="s" label="Standard" description="3–5 days, ৳60" checked={ship==='std'} onChange={()=>setShip('std')}/>
    <Radio name="s" label="Express" description="Next day, ৳180" checked={ship==='exp'} onChange={()=>setShip('exp')}/>
  </div>
  <div className="row" style={{gap:'var(--space-6)'}}><Switch label="Listing live" checked={on} onChange={()=>setOn(!on)}/><Switch size="sm" label="বাংলা" checked={bn} onChange={()=>setBn(!bn)}/><Switch label="Holiday mode" disabled/></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
