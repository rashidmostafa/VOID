<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Authentication" description="Sign in, registration, SMS and authenticator codes, password reset, lockout, guest order lookup and active sessions" -->
<helmet>
<title>Void — accounts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="../../assets/fonts/geist-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../assets/fonts/geist-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./auth.css">
<script>window.VOID_ICON_SPRITE = "../../assets/icons/void-icons.svg"</script>
<script src="./ds-base.js"></script>
</helmet>
<x-import component-from-global-scope="AuthApp" from="./AuthApp.jsx" screen="{{ screen }}" scheme="{{ scheme }}" width="{{ width }}" chrome="{{ chrome }}" hint-size="100%,900px"></x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;signin&quot;,&quot;signin_failed&quot;,&quot;signup&quot;,&quot;otp&quot;,&quot;totp&quot;,&quot;reset&quot;,&quot;reset_sent&quot;,&quot;locked&quot;,&quot;guest&quot;,&quot;sessions&quot;],&quot;default&quot;:&quot;signin&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Harness&quot;},&quot;scheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Harness&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1440&quot;,&quot;320&quot;],&quot;default&quot;:&quot;1440&quot;,&quot;tsType&quot;:&quot;\&quot;1440\&quot; | \&quot;320\&quot;&quot;,&quot;section&quot;:&quot;Harness&quot;},&quot;chrome&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Harness&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      screen: p.screen ?? "signin",
      scheme: p.scheme ?? "light",
      width: p.width ?? "1440",
      chrome: p.chrome ?? true,
    };
  }
}
</script>
</body>
</html>
