<!-- @dsCard group="Components" viewport="700x380" name="Tabs, SideNav" subtitle="Underline and segmented tabs; sectioned portal sidebar" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.VOID_ICON_SPRITE="../../assets/icons/void-icons.svg"</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:0;background:var(--background)}.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:var(--space-4)}.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:var(--tracking-widest);color:var(--text-muted)}</style>
</head><body><div id="root"></div><script type="text/babel">
const NS = window.VoidDesignSystem_980885;
const { Tabs, SideNav, Icon, Badge } = NS;
function Demo(){const [tab,setTab]=React.useState('open');const [face,setFace]=React.useState('Front');const [view,setView]=React.useState('orders');
return (<div style={{display:'flex',height:380}}>
  <SideNav value={view} onChange={setView}
    brand={<span style={{fontWeight:'var(--weight-semibold)',letterSpacing:'var(--tracking-widest)',textTransform:'uppercase',fontSize:'var(--text-sm)'}}>Void</span>}
    sections={[{title:'Sell',items:[{value:'orders',label:'Orders',icon:<Icon name="package"/>,badge:12},{value:'listings',label:'Listings',icon:<Icon name="shirt"/>},{value:'payouts',label:'Payouts',icon:<Icon name="wallet"/>}]},{title:'Shop',items:[{value:'profile',label:'Shop profile',icon:<Icon name="store"/>},{value:'settings',label:'Settings',icon:<Icon name="settings"/>}]}]}/>
  <div className="col" style={{flex:1,padding:'var(--space-6)',gap:'var(--space-8)'}}>
    <Tabs items={[{value:'open',label:'Open',count:12},{value:'ship',label:'To ship',count:3},{value:'done',label:'Delivered'},{value:'ret',label:'Returns',count:1}]} value={tab} onChange={setTab}/>
    <div className="col" style={{gap:'var(--space-3)'}}><span className="lbl">Segmented</span><Tabs variant="segmented" size="sm" items={['Front','Back','Sleeve']} value={face} onChange={setFace}/></div>
    <div className="row"><span className="lbl">selected</span><Badge>{view}</Badge><Badge tone="outline">{tab}</Badge><Badge tone="outline">{face}</Badge></div>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
